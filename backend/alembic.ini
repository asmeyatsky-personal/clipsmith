[alembic]
# %(here)s = directory of this ini file, so migrations resolve correctly
# regardless of the current working directory (e.g. Fly release_command runs
# `alembic -c backend/alembic.ini upgrade head` from the repo root /app).
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
